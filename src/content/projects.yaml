# All projects, in the order they appear on the Projects page.
# Each one gets its own page at /projects/<id>.
#
#   id           URL name (lowercase, dashes)
#   title
#   description  one line, shown on the Projects page card only
#   icon         path relative to this file
#   site         optional, link for the "Website" button
#   github       optional, link for the "GitHub" button
#   about        the write-up; leave a blank line between paragraphs
#   stack        list of technologies
#   images       screenshots shown on the project's page

- id: mindchord
  title: Mindchord
  description: Neurofeedback application
  icon: ../assets/projects/icons/mindchord.png
  site: https://mindchord.net
  about: |
    Mindchord is a neurofeedback app designed to be used at home with a portable EEG headset like Muse or Neurosity devices. Feedback protocols are set by Mindchord Providers using the separate Mindchord Dashboard app.

    Feedback is provided either through video sessions, where the video playing gets brighter or darker depending on how well the user is doing, or through interactive visualizations that update live to represent the score.

    Clinicians have the option to set three feedback bands (lo, hi, reward/inhibit) and choose the percentage of the time the user should be getting rewarded during the session. Every session starts with a calibration period where the user's current baselines for the feedback bands are measured.

    For more information check out mindchord.net or get in contact!
  stack:
    - Python
    - Brainflow
    - FastAPI
    - Jinja
    - HTML
    - Tailwind CSS
    - JS
  images:
    - ../assets/projects/mindchord-1.jpg
    - ../assets/projects/mindchord-2.png
    - ../assets/projects/mindchord-3.jpg
    - ../assets/projects/mindchord-4.jpg
    - ../assets/projects/mindchord-5.jpg
    - ../assets/projects/mindchord-6.jpg

